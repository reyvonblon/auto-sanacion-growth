services:
  - type: web
    name: auto-sanacion-francis-jaramillo
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: AUTOSANACION_HOST
        value: 0.0.0.0
      - key: AUTOSANACION_PORT
        value: "8080"
      - key: AUTOSANACION_DB_PATH
        value: /app/data/autosanacion.db
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: francisjaramilloautora@gmail.com
      - key: SMTP_FROM
        value: Francis Jaramillo <francisjaramilloautora@gmail.com>
      - key: SMTP_PASS
        sync: false
    disk:
      name: autosanacion-data
      mountPath: /app/data
      sizeGB: 1
